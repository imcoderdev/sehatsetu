<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SehatSetu — Offline Queue</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&display=swap" rel="stylesheet">
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="../css/styles.css">
</head>
<body>
    <!-- Offline Banner -->
    <div id="offline-banner" class="offline-banner hidden">
        ⚠️ You are offline — sync will happen automatically when connected
    </div>

    <!-- Navbar -->
    <nav class="navbar">
        <a href="../index.html" class="navbar-brand">🏥 SehatSetu</a>
        <div class="navbar-right">
            <span class="online-indicator"><span class="status-dot online"></span> Online</span>
        </div>
    </nav>

    <main class="container-sm" style="padding-top: 1.5rem; padding-bottom: 3rem;">
        <h1 style="font-size: 1.5rem; font-weight: 800; margin-bottom: 0.25rem;">Pending Submissions</h1>
        <p style="color: var(--text-muted); font-size: 0.9rem; margin-bottom: 1rem;">
            These patients are saved locally and will sync when internet returns.
        </p>

        <button class="btn btn-primary btn-block btn-lg mb-2" id="sync-btn" onclick="manualSync()">
            🔄 Sync Now
        </button>

        <div id="queue-list" class="card">
            <div class="loading-state">
                <div class="spinner"></div>
                <p class="mt-2">Loading queue...</p>
            </div>
        </div>

        <div class="mt-3">
            <a href="intake.html" class="btn btn-outline btn-block">← Back to Registration</a>
        </div>
    </main>

    <script src="../js/app.js"></script>
    <script src="../js/offline-db.js"></script>
    <script src="../js/sync.js"></script>
    <script>
        const queueList = document.getElementById('queue-list');
        const syncBtn = document.getElementById('sync-btn');

        async function renderQueue() {
            const queue = await getQueue();

            if (queue.length === 0) {
                queueList.innerHTML = `
                    <div class="empty-state">
                        <p style="font-size: 2rem;">✅</p>
                        <p>No pending submissions</p>
                        <p style="font-size: 0.85rem; color: var(--text-muted);">All patient data has been synced.</p>
                    </div>
                `;
                return;
            }

            queueList.innerHTML = queue.map(item => `
                <div class="queue-item">
                    <div class="queue-item-info">
                        <div class="queue-item-name">${item.name}</div>
                        <div class="queue-item-symptoms">${item.symptoms.substring(0, 60)}${item.symptoms.length > 60 ? '...' : ''}</div>
                        <div style="font-size: 0.75rem; color: var(--text-muted);">${item.village || 'No village'} • ${formatTime(item.queued_at)}</div>
                    </div>
                    <span class="queue-item-status">⏳ Pending</span>
                </div>
            `).join('');
        }

        async function manualSync() {
            if (!navigator.onLine) {
                showToast('No internet connection', 'error');
                return;
            }

            syncBtn.disabled = true;
            syncBtn.textContent = '⏳ Syncing...';

            const result = await syncQueue();

            if (result.synced > 0) {
                showToast(`✅ Synced ${result.synced} patient(s)!`);
            } else if (result.failed > 0) {
                showToast(`❌ Failed to sync ${result.failed} patient(s)`, 'error');
            } else {
                showToast('Nothing to sync');
            }

            syncBtn.disabled = false;
            syncBtn.textContent = '🔄 Sync Now';
            renderQueue();
        }

        renderQueue();

        // Auto-sync on page load when online
        if (navigator.onLine) {
            manualSync();
        }

        // Re-render after background auto-sync
        window.addEventListener('queue-synced', () => renderQueue());
    </script>
</body>
</html>
